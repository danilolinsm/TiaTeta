// ---------- provas ----------
async function loadExamsForChild(childId){
  try{
    const { data, error } = await db.from('exams').select('*').eq('child_id', childId);
    if(error) throw error;
    const list = data||[];
    list.sort((a,b)=>{
      if(!a.exam_date && !b.exam_date) return 0;
      if(!a.exam_date) return 1;
      if(!b.exam_date) return -1;
      return new Date(a.exam_date) - new Date(b.exam_date);
    });
    return list;
  }catch(e){ console.warn('loadExams falhou', e); return []; }
}
async function insertExamInDb(childId, subject, examDate, notes){
  const { data, error } = await db.from('exams').insert({ user_id: state.user.id, child_id: childId, subject, exam_date: examDate||null, notes: notes||null }).select().single();
  if(error){ console.warn('insertExam', error); throw error; }
  return data;
}
async function updateExamInDb(id, subject, examDate, notes){
  const { data, error } = await db.from('exams').update({ subject, exam_date: examDate||null, notes: notes||null }).eq('id', id).select().single();
  if(error){ console.warn('updateExam', error); throw error; }
  return data;
}
async function deleteExamInDb(id){
  const { error } = await db.from('exams').delete().eq('id', id);
  if(error){ console.warn('deleteExam', error); throw error; }
}
async function loadExamScoreSummary(examId){
  try{
    const { data, error } = await db.from('attempts').select('*').eq('exam_id', examId).order('answered_at');
    if(error) throw error;
    if(!data.length) return null;
    const totalCorrect = data.reduce((s,a)=>s+a.correct_count,0);
    const totalQuestions = data.reduce((s,a)=>s+a.total_questions,0);
    const last = data[data.length-1];
    return { attemptsCount:data.length, avgPct: Math.round((totalCorrect/totalQuestions)*100), lastPct: Math.round((last.correct_count/last.total_questions)*100), lastDate: last.answered_at };
  }catch(e){ console.warn('loadExamScoreSummary falhou', e); return null; }
}

async function loadChildDashboardData(childId){
  try{
    const [examsRes, attemptsRes] = await Promise.all([
      db.from('exams').select('*').eq('child_id', childId),
      db.from('attempts').select('*').eq('child_id', childId).not('exam_id','is',null)
    ]);
    const exams = examsRes.data || [];
    const attempts = attemptsRes.data || [];
    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = exams
      .filter(ex=>ex.exam_date && new Date(ex.exam_date+'T00:00:00') >= today)
      .sort((a,b)=> new Date(a.exam_date) - new Date(b.exam_date));
    const nextExam = upcoming[0] || null;
    let avgPct = null;
    if(attempts.length){
      const totalCorrect = attempts.reduce((s,a)=>s+a.correct_count,0);
      const totalQ = attempts.reduce((s,a)=>s+a.total_questions,0);
      avgPct = totalQ ? Math.round((totalCorrect/totalQ)*100) : null;
    }
    return { examsCount: exams.length, nextExam, avgPct };
  }catch(e){
    console.warn('loadChildDashboardData falhou', e);
    return { examsCount:0, nextExam:null, avgPct:null };
  }
}

}

  for(const c of state.children){

  }
  state.canGenerateImages = await loadMyPermission();
  loadAllChildDashboards(); // roda em paralelo, não trava o primeiro carregamento
}

async function loadMyPermission(){
  try{
    const { data, error } = await db.from('permissions').select('can_generate_images').eq('user_id', state.user.id).maybeSingle();
    if(error) throw error;
    return !!(data && data.can_generate_images);
  }catch(e){
    console.warn('não consegui checar permissão de imagem', e);
    return false;
  }
}

function activeChild(){ return state.children.find(c=>c.id===state.activeChildId); }

// ---------- AI calls ----------
async function callClaude(promptText, files){
  const res = await fetch('/api/claude', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ prompt: promptText, images: (files||[]).map(f=>({base64:f.base64, mediaType:f.mediaType, isPdf:f.isPdf})) })
  });
  if(res.status === 413){
    throw new Error('Os arquivos anexados são grandes demais para enviar de uma vez. Tente com menos fotos ou remova o PDF.');
  }
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  const clean = (data.text||'').replace(/```json|```/g,'').trim();
  try{
    return JSON.parse(clean);
  }catch(e){
    throw new Error('A resposta da IA veio incompleta (provavelmente por causa de uma quantidade grande de questões). Tente novamente ou peça menos questões.');
  }
}

async function proofreadTexts(items){
  try{
    const res = await fetch('/api/proofread', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ items })
    });
    const data = await res.json();
    if(data.error || !Array.isArray(data.items)) return items;
    return data.items;
  }catch(e){ console.warn('proofread falhou, mantendo texto original', e); return items; }
}

function ageBand(age){
  if(age<=8) return 'de 5 a 8 anos: frases bem curtas, vocabulário simples, poucas ideias por parágrafo';
  if(age<=11) return 'de 9 a 11 anos: frases médias, pode introduzir termos novos explicando-os';
  return 'de 12 a 13 anos: pode usar frases mais longas e vocabulário mais técnico, mantendo clareza';
}

async function callNanoBanana(promptText, signal){
  const res = await fetch('/api/image', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ prompt: promptText }),
    signal
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.dataUrl;
}

function buildQuestionImagePrompt(questionText, prefsText, age, feedback){
  let p = `Crie UMA ilustração simples, estilo desenho animado infantil colorido, quadrada, sem nenhum texto ou letra dentro da imagem, representando o tema desta questão de prova para uma criança de ${age} anos: "${questionText}".
${prefsText ? `Se fizer sentido, incorpore elementos de ${prefsText} de forma sutil, sem distrair do conteúdo da questão.` : ''}
A imagem deve ser clara, objetiva e ajudar a criança a entender visualmente o que a questão está perguntando — não pode ter elementos assustadores, confusos ou fora do tema.`;
  if(feedback) p += `\n\nAjuste pedido na revisão: ${feedback}`;
  return p;
}

async function verifyImageWithClaude(dataUrl, questionText){
  const base64 = dataUrl.split(',')[1];
  const prompt = `Você está revisando uma ilustração gerada por IA para uma questão de prova infantil. Contexto da questão: "${questionText}".
Verifique: (1) a imagem é apropriada para crianças, sem nada assustador ou confuso; (2) ela representa razoavelmente o tema da questão (não precisa ser perfeita, só coerente); (3) não tem texto ilegível, errado ou fora do lugar atrapalhando.
Responda APENAS em JSON, sem markdown: {"ok": true ou false, "motivo": "breve explicação em poucas palavras"}`;
  return await callClaude(prompt, [{ base64, mediaType:'image/jpeg', isPdf:false }]);
}

async function illustrateQuestions(activity, prefsText, age){
  const total = activity.questoes.length;
  for(let i=0;i<total;i++){
    state.loadingMsg = `Ilustrando questão ${i+1}/${total}...`; render();
    const q = activity.questoes[i];
    try{
      let img = await callNanoBanana(buildQuestionImagePrompt(q.pergunta, prefsText, age));
      let check = { ok:true };
      try{ check = await verifyImageWithClaude(img, q.pergunta); }catch(e){ /* se a revisão falhar, mantém a imagem sem bloquear */ }
      if(check && check.ok===false){
        state.loadingMsg = `Corrigindo ilustração da questão ${i+1}/${total}...`; render();
        try{ img = await callNanoBanana(buildQuestionImagePrompt(q.pergunta, prefsText, age, check.motivo)); }catch(e){ /* mantém a primeira versão se a segunda falhar */ }
      }
      q.imagem = img;
    }catch(e){
      console.warn('ilustração da questão '+(i+1)+' falhou', e);
    }
    state.loadingDone = 3 + i + 1;
    render();
  }
}


function buildPosterPrompt(subject, resumoText, mapaNodes, prefsText, age, feedback){
  let p = `Crie um pôster de estudos ilustrado, estilo desenho animado infantil colorido e alegre, formato retrato A4, para uma criança de ${age} anos que gosta de ${prefsText||'temas lúdicos'}.
Assunto: "${subject}".
IMPORTANTE: identifique o idioma usado no resumo abaixo e escreva TODO o texto do pôster (título, guia, legendas, faixa final) nesse mesmo idioma — não traduza para português se o resumo estiver em outro idioma.
Abaixo do título, um pequeno guia numerado equivalente a "1. Resumo  2. Mapa mental  3. Questões para praticar" (traduzido para o idioma do resumo).
Ilustre uma cena temática grande e cheia de detalhes relacionada ao assunto, incorporando elementos de ${prefsText||'algo lúdico'} quando fizer sentido.
Distribua pelo pôster pequenas caixas de texto ou placas explicando estes conceitos, com texto curto e correto no mesmo idioma do resumo:
${mapaNodes.map(n=>`- ${n.label}`).join('\n')}
Baseie as explicações neste resumo: """${(resumoText||'').slice(0,500)}"""
No rodapé, inclua uma faixa equivalente a "QUESTÕES PARA PRATICAR" no idioma do resumo.
Texto bem legível, sem erros de ortografia. Cores vivas, sem elementos assustadores.`;
  if(feedback) p += `\n\nAjuste pedido pela mãe: ${feedback}`;
  return p;
}

async function generateActivity(subject, files, count){
  const child = activeChild();
  const prefsText = child.prefs.map(prefLabel).join(', ');
  const hasFiles = files && files.length;
  const sourceInstruction = hasFiles
    ? `Foram anexados ${files.length} arquivo(s) (páginas do livro e/ou aviso da prova). ESSES ARQUIVOS SÃO A ÚNICA FONTE DE VERDADE do conteúdo — extraia o resumo, os conceitos do mapa mental e as questões do simulado exclusivamente do que está escrito/ilustrado neles. O campo "assunto" abaixo é só um rótulo/contexto dado pela mãe para ajudar a localizar o tema dentro dos arquivos — NÃO use conhecimento geral sobre esse assunto para complementar ou substituir o que está nos arquivos. Se o assunto informado não bater exatamente com o conteúdo dos arquivos, priorize sempre o que está nos arquivos.`
    : `Não há arquivo anexado. Baseie-se no assunto informado abaixo, usando conhecimento pedagógico geral adequado à série escolar da criança.`;
  const fallbackLang = state.lang==='en' ? 'inglês' : 'português do Brasil';
  const langInstruction = hasFiles
    ? `Identifique automaticamente o idioma predominante do texto nos arquivos anexados, e gere TODO o conteúdo (resumo, mapa mental, questões e alternativas) nesse mesmo idioma — mesmo que seja diferente do idioma desta instrução. Se por algum motivo não conseguir identificar um idioma claro nos arquivos, use ${fallbackLang}.`
    : `Gere todo o conteúdo em ${fallbackLang}.`;
  const prompt = `Você é um assistente pedagógico ajudando uma mãe a preparar a(o) filha(o) de ${child.age} anos (faixa etária ${ageBand(child.age)}) para uma prova.
A criança gosta de: ${prefsText || 'nenhuma preferência informada'}.
Assunto informado pela mãe (rótulo/contexto): "${subject}".
${sourceInstruction}
${langInstruction}

Gere um JSON (APENAS o JSON, sem texto antes ou depois, sem markdown) no seguinte formato:
{
  "resumo": "resumo em 3 a 5 parágrafos curtos, linguagem adequada à idade",
  "mapa": [{"label":"nome curto do conceito (max 4 palavras)","emoji":"um emoji que combine com o conceito, se possível relacionado a ${prefsText||'algo lúdico'}"}, ... 4 a 6 itens],
  "questoes": [{"pergunta":"...", "opcoes":["a","b","c","d"], "correta":0}, ... exatamente ${count} itens]
}`;
  return await callClaude(prompt, files);
}

async function getQuestionHint(question, age){
  const prompt = `Uma criança de ${age} anos está tentando responder esta questão de múltipla escolha sozinha:
"${question.pergunta}"
Alternativas: ${question.opcoes.map((o,i)=>`${String.fromCharCode(97+i)}) ${o}`).join(', ')}

Dê APENAS uma dica curta (1-2 frases) que ajude a criança a pensar no caminho certo, do jeito socrático: faça uma pergunta ou aponte um detalhe importante, mas NUNCA diga qual é a alternativa correta nem entregue a resposta.
Responda em texto simples, sem JSON, sem markdown — só a dica.`;
  const res = await fetch('/api/claude', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ prompt, images: [] })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return (data.text||'').trim();
}

async function generateWeakFocusQuestions(activity, wrongTexts, count, age){
  const prompt = `Uma criança de ${age} anos errou estas questões sobre "${activity.subject}":
${wrongTexts.map((w,i)=>`${i+1}. ${w}`).join('\n')}

Gere ${count} questões NOVAS de múltipla escolha (4 alternativas cada) sobre o(s) MESMO(S) conceito(s) dessas questões que ela errou — mesma dificuldade, mas com números/situações diferentes, pra ela praticar de novo até fixar.
Responda APENAS um JSON, sem markdown: {"questoes":[{"pergunta":"...","opcoes":["a","b","c","d"],"correta":0}, ...]}`;
  const res = await fetch('/api/claude', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ prompt, images: [] })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  const clean = (data.text||'').replace(/```json|```/g,'').trim();
  return JSON.parse(clean).questoes;
}

function bindAuthEvents(){
  const submit = document.getElementById('auth-submit');
  const toggle = document.getElementById('auth-toggle');
  if(toggle) toggle.onclick = ()=>{ state.authMode = state.authMode==='signup'?'login':'signup'; state.authError=null; render(); };
  if(submit) submit.onclick = async ()=>{
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-err');
    if(!email || !password){ errEl.textContent='Preencha email e senha.'; errEl.style.display='block'; return; }
    submit.textContent = 'Aguarde...';
    const fn = state.authMode==='signup' ? db.auth.signUp({email,password}) : db.auth.signInWithPassword({email,password});
    const { data, error } = await fn;
    if(error){
      state.authError = error.message;
      render();
      return;
    }
    if(state.authMode==='signup' && data.user && !data.session){
      state.authError = null;
      alert('Conta criada! Verifique seu email para confirmar antes de entrar.');
      state.authMode = 'login';
      render();
      return;
    }
    // onAuthStateChange cuida do resto (carregar dados e navegar pro app)
  };
}

async function loadExamsForCurrentChild(){
  const child = activeChild();
  if(!child) return;
  state.examsLoading = true; state.exams = []; state.examSummaries = {};
  render();
  const exams = await loadExamsForChild(child.id);
  state.exams = exams;
  const summaries = await Promise.all(exams.map(ex=>loadExamScoreSummary(ex.id)));
  state.examSummaries = {};
  exams.forEach((ex,i)=>{ if(summaries[i]) state.examSummaries[ex.id] = summaries[i]; });
  state.examsLoading = false;
  render();
}

function renderHistorico(){
  const child = activeChild();
  if(!child) return `<div class="card empty"><span class="em">🙈</span>Cadastre um filho primeiro.</div>`;
  const acts = state.activities[child.id]||[];
  let h = '';
  if(state.celebrate){
    h += `<div class="card no-print" style="text-align:center;padding:14px">
      <img src="/mascot-comemorando.jpg" alt="" style="width:90px;border-radius:12px;margin-bottom:6px">
      <p style="font-size:13px;font-weight:500;margin:0">Atividade salva! 🎉</p>
    </div>`;
  }
  h += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px">
    <h2 style="font-size:17px">${t('history')}</h2>
    ${state.children.length>1?`<select id="switch-child-hist" style="width:auto">${state.children.map(c=>`<option value="${c.id}" ${c.id===child.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>`:`<span style="font-size:13px;color:var(--sub)">${escapeHtml(child.name)}</span>`}
  </div>`;
  if(!acts.length){ h += `<div class="card empty"><img src="/mascot-vazio.jpg" alt="" style="width:120px;border-radius:12px;margin-bottom:10px">${t('no_history')}</div>`; return h; }
  if(state.openHistoryId){
    const a = acts.find(x=>x.id===state.openHistoryId);
    if(a){
      h += `<button class="btn-ghost no-print" id="back-hist" style="margin-bottom:10px">${t('back')}</button>`;
      h += renderActivityResult(a, false);
      return h;
    }
  }
  for(const a of acts.slice().reverse()){
    let examBadge = '';
    if(a.examDate){
      const days = Math.ceil((new Date(a.examDate) - new Date())/86400000);
      examBadge = days>=0 ? `<br><small style="color:var(--teal-dark);font-weight:600">⏳ ${days}d p/ prova</small>` : '';
    }
    h += `<div class="hist-item" data-open-hist="${a.id}">
      <div><strong style="font-size:14px">${escapeHtml(a.subject)}</strong><br><small style="color:var(--sub)">${new Date(a.createdAt).toLocaleDateString('pt-BR')} · ${a.questoes.length} questões</small>${examBadge}</div>
      <span style="color:var(--sub)">›</span>
    </div>`;
  }
  return h;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function totalPendingBytes(){

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{ img.src = reader.result; };
    reader.onerror = reject;
    img.onload = ()=>{
      const MAX_DIM = 1600;
      let { width, height } = img;
      if(width > MAX_DIM || height > MAX_DIM){
        const scale = MAX_DIM / Math.max(width, height);
        width = Math.round(width*scale); height = Math.round(height*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      resolve({ dataUrl, base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
  async function addFiles(fileList){

        if(file.type === 'application/pdf'){
          if(file.size > 3*1024*1024){
            window.__toast = `O arquivo "${file.name}" é muito grande (PDFs grandes não são suportados — tente uma foto da página em vez do PDF, ou um PDF menor).`;
            setTimeout(()=>{window.__toast=null;render();},5000); render();
            continue;
          }
          const dataUrl = await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
          fileData = { dataUrl, base64: dataUrl.split(',')[1], mediaType: 'application/pdf' };
        } else {
          fileData = await compressImage(file);
        }
        const newBytes = Math.ceil(fileData.base64.length*0.75);
        if(totalPendingBytes() + newBytes > MAX_TOTAL_BYTES){
          window.__toast = `Não deu pra anexar "${file.name}" — o total de arquivos ficaria grande demais para enviar. Remova algum ou tire fotos com menos arquivos por vez.`;

      }catch(e){

        window.__toast = `Não consegui processar "${file.name}".`;
        setTimeout(()=>{window.__toast=null;render();},4000); render();
      }
    }

  const isEn = state.lang==='en';
  const fullName = (state.user && state.user.user_metadata && state.user.user_metadata.full_name) || '';
  window.__modal = `<div class="modal-bg" id="modal-bg"><div class="modal">
    <h3 style="font-size:16px;margin-bottom:12px">${isEn?'My account':'Minha conta'}</h3>

    <label class="field-label">${t('email')}</label>
    <input type="email" value="${escapeHtml(state.user?.email||'')}" disabled style="margin-bottom:14px;opacity:0.7">

    <label class="field-label">${isEn?'Name':'Nome'}</label>
    <input type="text" id="acc-name" value="${escapeHtml(fullName)}" placeholder="${isEn?'Your name':'Seu nome'}" style="margin-bottom:8px">
    <button class="btn btn-block" id="acc-save-name" style="margin-bottom:16px">${isEn?'Save name':'Salvar nome'}</button>

    <label class="field-label">${isEn?'How do you use the app?':'Como você usa o app?'}</label>
    <div class="row" style="margin-bottom:16px">
      <button class="btn ${state.role==='student'?'btn-primary':''}" id="acc-role-student" style="text-align:left;padding:10px 12px">🎓 ${isEn?'Student':'Estudante'}</button>
      <button class="btn ${state.role==='parent'?'btn-primary':''}" id="acc-role-parent" style="text-align:left;padding:10px 12px">👨‍👩‍👧 ${isEn?'Parent':'Pai/mãe'}</button>
    </div>

    <label class="field-label">${isEn?'New password':'Nova senha'}</label>
    <input type="password" id="acc-pw1" placeholder="${isEn?'Min. 6 characters':'Mínimo 6 caracteres'}" style="margin-bottom:8px">
    <label class="field-label">${isEn?'Confirm new password':'Confirmar nova senha'}</label>
    <input type="password" id="acc-pw2" style="margin-bottom:8px">
    <button class="btn btn-block" id="acc-save-pw">${isEn?'Save new password':'Salvar nova senha'}</button>

    <p class="err" id="acc-err" style="display:none"></p>
    <p id="acc-ok" style="display:none;color:var(--teal);font-size:13px;margin-top:8px">${isEn?'Saved!':'Salvo!'}</p>

    <button class="btn btn-block" id="modal-cancel" style="margin-top:16px">${isEn?'Close':'Fechar'}</button>
    <button class="btn-ghost" id="acc-admin-btn" style="margin-top:10px;font-size:12px">🛠️ ${isEn?'Admin area':'Área do administrador'}</button>
  </div></div>`;
  render();

  document.getElementById('modal-cancel').onclick = ()=>{ window.__modal=null; render(); };

  document.getElementById('acc-admin-btn').onclick = ()=>{ window.__modal=null; openAdminArea(); };

  document.getElementById('acc-role-student').onclick = ()=> switchRole('student');
  document.getElementById('acc-role-parent').onclick = ()=> switchRole('parent');
  async function switchRole(role){
    if(state.role===role) return;
    try{ await db.auth.updateUser({ data:{ role } }); }catch(e){ console.warn('não consegui salvar role', e); }
    state.role = role;
    openAccountModal();
  }

  document.getElementById('acc-save-name').onclick = async ()=>{
    const name = document.getElementById('acc-name').value.trim();
    const errEl = document.getElementById('acc-err'); const okEl = document.getElementById('acc-ok');
    errEl.style.display='none'; okEl.style.display='none';
    try{
      const { data, error } = await db.auth.updateUser({ data:{ full_name:name } });
      if(error) throw error;
      state.user = data.user;
      okEl.style.display='block';
    }catch(e){ errEl.textContent = e.message; errEl.style.display='block'; }
  };

  document.getElementById('acc-save-pw').onclick = async ()=>{
    const pw1 = document.getElementById('acc-pw1').value;
    const pw2 = document.getElementById('acc-pw2').value;
    const errEl = document.getElementById('acc-err'); const okEl = document.getElementById('acc-ok');
    errEl.style.display='none'; okEl.style.display='none';
    if(pw1.length<6){ errEl.textContent = isEn?'Password must be at least 6 characters.':'A senha precisa ter pelo menos 6 caracteres.'; errEl.style.display='block'; return; }
    if(pw1!==pw2){ errEl.textContent = isEn?"Passwords don't match.":'As senhas não coincidem.'; errEl.style.display='block'; return; }
    try{
      const { error } = await db.auth.updateUser({ password: pw1 });
      if(error) throw error;
      document.getElementById('acc-pw1').value=''; document.getElementById('acc-pw2').value='';
      okEl.style.display='block';
    }catch(e){ errEl.textContent = e.message; errEl.style.display='block'; }
  };
}

async function openAdminArea(){
  state.showAdmin = true;
  state.adminLoading = true; state.adminError = null; state.adminUsers = null; state.adminPermissions = null; state.adminRequests = null;
  render();
  try{
    const [usersRes, permRes] = await Promise.all([
      fetch('/api/admin-users', { headers: { Authorization: `Bearer ${state.session.access_token}` } }),
      fetch('/api/admin-permissions', { headers: { Authorization: `Bearer ${state.session.access_token}` } })
    ]);
    const usersData = await usersRes.json();
    if(usersData.error) throw new Error(usersData.error);
    const permData = await permRes.json();
    if(permData.error) throw new Error(permData.error);
    state.adminUsers = usersData.users;
    state.adminPermissions = permData.permissions || [];
    state.adminRequests = permData.requests || [];
  }catch(e){
    state.adminError = e.message || 'Erro ao carregar usuários';
  }
  state.adminLoading = false;
  render();
}

async function toggleUserImagePermission(userId, value){
  try{
    const res = await fetch('/api/admin-permissions', {
      method:'POST',
      headers: { 'Content-Type':'application/json', Authorization: `Bearer ${state.session.access_token}` },
      body: JSON.stringify({ action:'toggle', user_id:userId, value })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const idx = state.adminPermissions.findIndex(p=>p.user_id===userId);
    if(idx>-1) state.adminPermissions[idx].can_generate_images = value;
    else state.adminPermissions.push({ user_id:userId, can_generate_images:value });
  }catch(e){
    window.__toast = 'Não consegui salvar a permissão: ' + (e.message||'erro');
    setTimeout(()=>{window.__toast=null;render();},4000);
  }
  render();
}

function renderAdminArea(){
  let h = `<button class="btn-ghost no-print" id="admin-back" style="margin-bottom:10px">← Voltar</button>`;
  h += `<h2 style="font-size:17px;margin-bottom:12px">🛠️ Área do administrador</h2>`;
  if(state.adminLoading){
    h += `<div class="loading"><img src="/mascot.jpg" alt="" class="spin-mascot"><br>Carregando usuários...</div>`;
    return h;
  }
  if(state.adminError){
    h += `<div class="card"><p class="err" style="display:block">${escapeHtml(state.adminError)}</p></div>`;
    return h;
  }
  const users = state.adminUsers || [];
  const perms = state.adminPermissions || [];
  const requests = state.adminRequests || [];

  if(requests.length){
    h += `<div class="card" style="background:var(--teal-soft);border:1.5px solid var(--teal)">
      <p style="font-weight:600;font-size:14px;margin:0 0 8px">📬 ${requests.length} pedido(s) de acesso pendente(s)</p>
      ${requests.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid rgba(0,0,0,0.06)">
        <span style="font-size:13px">${escapeHtml(r.email)}</span>
        <button class="btn btn-primary" data-approve-request="${r.id}" data-approve-user="${r.user_id}" style="font-size:12px;padding:6px 10px">Aprovar</button>
      </div>`).join('')}
    </div>`;
  }

  h += `<p style="font-size:12px;color:var(--sub);margin-bottom:12px">${users.length} usuário(s) cadastrado(s)</p>`;
  for(const u of users){
    const created = u.created_at ? new Date(u.created_at).toLocaleDateString('pt-BR') : '—';
    const lastLogin = u.last_sign_in_at ? new Date(u.last_sign_in_at).toLocaleDateString('pt-BR') : 'nunca entrou';
    const confirmed = u.email_confirmed_at ? '✅ email confirmado' : '⚠️ email não confirmado';
    const perm = perms.find(p=>p.user_id===u.id);
    const canImg = !!(perm && perm.can_generate_images);
    h += `<div class="card" style="padding:14px">
      <p style="font-size:13px;font-weight:500;margin:0">${escapeHtml(u.full_name || u.email)}</p>
      <p style="font-size:12px;color:var(--sub);margin:2px 0 0">${escapeHtml(u.email)}</p>
      <p style="font-size:11px;color:var(--sub);margin:6px 0 0">Cadastrado em ${created} · Último acesso: ${lastLogin}</p>
      <p style="font-size:11px;color:var(--sub);margin:2px 0 10px">${confirmed}${u.role?` · perfil: ${u.role==='student'?'estudante':'pai/mãe'}`:''}</p>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:10px">
        <span style="font-size:12px">🎨 Pode gerar imagens</span>
        <button data-toggle-img="${u.id}" data-current="${canImg?'1':'0'}" class="toggle-switch ${canImg?'on':''}" role="switch" aria-checked="${canImg}"><span></span></button>
      </div>
      <button class="btn" data-reset-email="${escapeHtml(u.email)}" style="font-size:12px">Enviar redefinição de senha</button>
    </div>`;
  }
  return h;
}

function bindAdminEvents(){
  const backBtn = document.getElementById('admin-back');
  if(backBtn) backBtn.onclick = ()=>{ state.showAdmin = false; render(); };
  document.querySelectorAll('[data-reset-email]').forEach(b=>b.onclick = async ()=>{
    const email = b.dataset.resetEmail;
    b.disabled = true; b.textContent = 'Enviando...';
    try{
      const { error } = await db.auth.resetPasswordForEmail(email);
      if(error) throw error;
      b.textContent = 'Email enviado ✓';
    }catch(e){
      b.textContent = 'Erro ao enviar';
      console.warn(e);
    }
  });

  document.querySelectorAll('[data-toggle-img]').forEach(b=>b.onclick = ()=>{
    const userId = b.dataset.toggleImg;
    const newVal = b.dataset.current !== '1';
    toggleUserImagePermission(userId, newVal);
  });

  document.querySelectorAll('[data-approve-request]').forEach(b=>b.onclick = async ()=>{
    const requestId = b.dataset.approveRequest;
    const userId = b.dataset.approveUser;
    b.disabled = true; b.textContent = '...';
    try{
      await fetch('/api/admin-permissions', {
        method:'POST',
        headers: { 'Content-Type':'application/json', Authorization: `Bearer ${state.session.access_token}` },
        body: JSON.stringify({ action:'resolve_request', request_id:requestId })
      });
      await toggleUserImagePermission(userId, true);
      state.adminRequests = (state.adminRequests||[]).filter(r=>r.id!==requestId);
      render();
    }catch(e){
      b.textContent = 'Erro';
      console.warn(e);
    }
  });
}

function openReportModal(part){
  window.__modal = `<div class="modal-bg" id="modal-bg"><div class="modal">
    <h3 style="font-size:16px;margin-bottom:10px">O que deu errado?</h3>
    <textarea id="feedback-text" placeholder="Ex: muito difícil para a idade, informação errada, texto longo demais..."></textarea>
    <p class="err" id="modal-err" style="display:none"></p>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-send">Gerar de novo</button>
    </div>
  </div></div>`;
  render();
  document.getElementById('modal-cancel').onclick = ()=>{ window.__modal=null; render(); };
  document.getElementById('modal-send').onclick = async ()=>{
    const fb = document.getElementById('feedback-text').value.trim();
    const errEl = document.getElementById('modal-err');
    if(!fb){ errEl.textContent='Conte rapidamente o que estava errado.'; errEl.style.display='block'; return; }
    window.__modal = null;
    const a = state.currentActivity || findOpenHistoryActivity();
    state.loading = true; state.loadingMsg = part==='mapa' && a.mapaImage ? 'Redesenhando o pôster (pode levar até 40s)...' : 'Gerando de novo...'; startLoadingTimer(); render();
    try{
      if(part==='mapa' && a.mapaImage){
        const child = activeChild();
        const prefsText = child.prefs.map(prefLabel).join(', ');
        const newImg = await callNanoBanana(buildPosterPrompt(a.subject, a.resumo, a.mapa, prefsText, child.age, fb));
        a.mapaVersions.push(a.mapaImage);
        a.mapaImage = newImg;
      } else {
        const result = await regenerateWithFeedback(part, a, fb);
        if(part==='resumo'){ a.resumo = result.resumo; a.resumoVersions.push(result.resumo); }
        else { a.mapa = result.mapa; a.mapaVersions.push(result.mapa); }
      }
    }catch(e){ console.error(e); window.__toast = 'Não consegui gerar de novo agora. Tente mais uma vez.'; setTimeout(()=>{window.__toast=null;render();},4000); }
    await persistIfSaved(a);
    stopLoadingTimer(); state.loading = false; render();
  };
}

// ---------- init ----------
(async function init(){
  app.innerHTML = '<div class="loading"><img src="/mascot.jpg" alt="" class="spin-mascot"><br>Carregando...</div>';

  const { data: { session } } = await db.auth.getSession();
  state.session = session; state.user = session ? session.user : null;
  state.role = state.user ? (state.user.user_metadata && state.user.user_metadata.role) || null : null;
  if(state.session) await loadUserData();
  render();

  db.auth.onAuthStateChange(async (event, session)=>{
    const hadSession = !!state.session;
    state.session = session; state.user = session ? session.user : null;
    state.role = state.user ? (state.user.user_metadata && state.user.user_metadata.role) || null : null;
    if(session && !hadSession){
      state.children = []; state.activities = {}; state.activeChildId = null;
      app.innerHTML = '<div class="loading"><img src="/mascot.jpg" alt="" class="spin-mascot"><br>Carregando seus dados...</div>';
      await loadUserData();
      render();
    } else if(!session){
      state.children = []; state.activities = {}; state.activeChildId = null; state.currentActivity = null;
      state.view = 'filhos'; state.authError = null; state.role = null;
      render();
    }
  });
})();
</script>
