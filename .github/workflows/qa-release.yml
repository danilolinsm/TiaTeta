name: QA e release

# Movido de estuda-comigo/.github/workflows/ para a raiz: o GitHub só lê workflows em
# .github/workflows/ na raiz do repo. Todo o app fica em estuda-comigo/, então os passos
# `run:` rodam lá (defaults.run.working-directory) e os caminhos de `uses:` apontam para lá.
#
# Nenhum segredo fica neste arquivo. Configure em Settings > Secrets and variables > Actions:
#   Secrets:
#     ANTHROPIC_API_KEY  — usado só no job pago "analise" (agente de QA)
#     QA_TEST_EMAIL      — conta de teste de QA (login no Playwright dos screenshots)
#     QA_TEST_PASSWORD   — senha dessa conta de teste
#   Variables:
#     QA_BASE_URL        — URL onde o app roda (ex.: preview/produção da Vercel); sem ela o
#                          Playwright tenta http://localhost:3000, que não existe no runner
#     QA_AGENTE_LLM_ATIVO — "true" para liberar o job pago; qualquer outro valor = desligado
#     QA_AGENTE_LLM_ATIVO — TRAVA GERAL: enquanto não for "true", o agendamento (cron) não roda
#                           NENHUM job e o job pago nunca roda (nem manualmente). Sem a variável
#                           criada, nada dispara sozinho depois do merge.
#   GITHUB_TOKEN é automático (não precisa cadastrar).
# Também é preciso:
#   - environment "agente-llm" com você como required reviewer (Settings > Environments);
#   - labels "release-blocker" e "release-candidate" criadas no repo;
#   - Settings > Actions > General > Workflow permissions: marcar
#     "Allow GitHub Actions to create and approve pull requests" (o registro de custo abre um PR).
#
# Nenhum job faz push na main: o registro de custo vai para uma branch própria (qa/custo-<run>)
# e abre um PR para revisão. Este workflow não tem gatilhos push/pull_request.

on:
  schedule:
    # 01:00 UTC = 04:00 no fuso local (UTC+3), segunda a sexta.
    # O horario e por conveniencia: o preco por token nao varia com a hora.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

concurrency:
  group: qa-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: estuda-comigo

jobs:
  # Fase 0. Determinística, custo zero, sem aprovacao.
  # Se o build quebrar aqui, nenhum token e gasto.
  preflight:
    runs-on: ubuntu-latest
    # No cron só roda com a trava ligada; manualmente (workflow_dispatch) roda sempre —
    # este job não gasta tokens de IA (só minutos do Actions e o login de QA nos screenshots).
    if: github.event_name == 'workflow_dispatch' || vars.QA_AGENTE_LLM_ATIVO == 'true'
    permissions:
      contents: read
      issues: write
    outputs:
      mudou: ${{ steps.diff.outputs.mudou }}
      build_ok: ${{ steps.check.outputs.build_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: estuda-comigo/package-lock.json

      - run: npm ci

      - name: Nada mudou desde a ultima execucao?
        id: diff
        run: |
          ATUAL=$(git rev-parse HEAD)
          ANTERIOR=$(cat .last-qa-commit 2>/dev/null || echo "")
          if [ "$ATUAL" = "$ANTERIOR" ]; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-voo
        id: check
        if: steps.diff.outputs.mudou == 'true'
        env:
          QA_BASE_URL: ${{ vars.QA_BASE_URL }}
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: |
          npx playwright install --with-deps chromium
          bash agentes/qa-release/preflight.sh && CODIGO=0 || CODIGO=$?
          if [ "$CODIGO" -eq 2 ]; then
            echo "build_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.mudou == 'true'
        with:
          name: preflight
          path: estuda-comigo/preflight.json
          retention-days: 7

      - name: Avisar build quebrado
        if: steps.check.outputs.build_ok == 'false'
        run: |
          gh issue create \
            --title "Build quebrado — nenhum token gasto" \
            --body "$(jq -r '.etapas[] | select(.codigo != 0) | .saida' preflight.json | head -c 4000)" \
            --label "release-blocker"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fases pagas. Travam esperando sua aprovacao.
  # O environment "agente-llm" precisa ter voce como required reviewer
  # em Settings > Environments, com wait timer de 6 horas.
  # Trava extra: só roda com a variável QA_AGENTE_LLM_ATIVO = "true" (em qualquer gatilho,
  # inclusive manual), porque gasta tokens e usa ANTHROPIC_API_KEY. Se o environment ainda não
  # existir, o GitHub o cria SEM proteção na primeira execução — por isso o job fica desligado
  # por padrão até você configurar tudo.
  analise:
    needs: preflight
    if: needs.preflight.outputs.mudou == 'true' && needs.preflight.outputs.build_ok == 'true' && vars.QA_AGENTE_LLM_ATIVO == 'true'
    runs-on: ubuntu-latest
    environment: agente-llm
    permissions:
      contents: write       # push da branch qa/custo-<run> (nunca da main)
      pull-requests: write  # abrir o PR do registro de custo
      issues: write         # agent.py abre issue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r agentes/qa-release/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: preflight
          path: estuda-comigo

      - name: Rodar agente
        run: python agentes/qa-release/agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Teto rigido. Estourou, aborta e registra na issue.
          QA_TETO_USD: "2.00"
          # Batch corta 50%. Ligue depois do dia 10 do plano.
          QA_USAR_BATCH: "false"

      # Registro de custo via PR automático (nunca push direto na main).
      # Requer "Allow GitHub Actions to create and approve pull requests" ligado no repo.
      # Obs.: PRs abertos com o GITHUB_TOKEN não disparam outros workflows (comportamento do GitHub).
      - name: Registrar custo (abre PR)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="qa/custo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "agente-qa"
          git config user.email "agente@tia-teta.local"
          git switch -c "$BRANCH"
          mkdir -p docs/agentes
          if [ -f custo.log ]; then
            cat custo.log >> docs/agentes/CUSTOS.md
            git add docs/agentes/CUSTOS.md
          fi
          # .last-qa-commit está no .gitignore, mas precisa ir para o repo (o job "preflight" lê dele)
          if [ -f .last-qa-commit ]; then
            git add -f .last-qa-commit
          fi
          if git diff --cached --quiet; then
            echo "Nada para registrar."
            exit 0
          fi
          git commit -m "chore(qa): registro de custo da execucao ${GITHUB_RUN_ID}"
          git push origin "$BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore(qa): registro de custo — execução ${GITHUB_RUN_ID}" \
            --body "Registro automático de custo do agente de QA (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Revise e faça o merge manualmente."

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: estuda-comigo/release-package/
          retention-days: 30
